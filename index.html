<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friendsgiving 2026: who’s bringing what</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style id="potluck-css">
/* ---------- tokens ---------- */
:root {
  --page: #F2B632;
  --dots: #E5A521;
  --ink: #2B1409;
  --ink-soft: #5B3A21;
  --paper: #FFF6E1;
  --paper-2: #F7E6BF;
  --line: #2B1409;
  --shadow: #2B1409;
  --cran: #A81E24;
  --cran-ink: #FFF6E1;
  --avo: #4E6A25;
  --avo-wash: #E3ECC8;
  --pump: #D9601A;
  --crust: #C98A3B;
  --cloth: #FFF1DA;
  --check: rgba(168, 30, 36, .52);
  --cloth-stitch: rgba(255, 255, 255, .8);
  --stitch: rgba(43, 20, 9, .28);
  --plate: #FFFDF6;
  --plate-rim: #E6D9BC;
  --side: #2B1409;
  --side-ink: #FFF6E1;
  --side-soft: #D6BB92;
  --hi: #FFD867;
  --hi-ink: #2B1409;
  --title-fill: #FFF6E1;
  --title-stroke: #2B1409;
  --title-shadow: #A81E24;
  --field: #FFFDF6;
  --backdrop: rgba(30, 12, 5, .55);
  --focus: #2B1409;
  --font-d: "Caprasimo", "Cooper Black", "Rockwell Extra Bold", Georgia, serif;
  --font-b: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tray-h: 0px;
  --bar-h: 0px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #1D0D0A;
    --dots: #2B1511;
    --ink: #FBE8C4;
    --ink-soft: #CFB189;
    --paper: #3A2019;
    --paper-2: #4A2A20;
    --line: #0B0403;
    --shadow: #0B0403;
    --cran: #E05A60;
    --cran-ink: #1D0D0A;
    --avo: #B4CE78;
    --avo-wash: #2E3A1B;
    --pump: #F28A45;
    --crust: #B77A33;
    --cloth: #5E171B;
    --check: rgba(0, 0, 0, .3);
    --cloth-stitch: rgba(251, 232, 196, .32);
    --stitch: rgba(251, 232, 196, .25);
    --plate: #F2E7CE;
    --plate-rim: #D6C7A4;
    --side: #0F0605;
    --side-ink: #FBE8C4;
    --side-soft: #A98C68;
    --hi: #F2B632;
    --hi-ink: #2B1409;
    --title-fill: #F2B632;
    --title-stroke: #0B0403;
    --title-shadow: #A81E24;
    --field: #2A1612;
    --backdrop: rgba(0, 0, 0, .65);
    --focus: #FBE8C4;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --page: #1D0D0A;
  --dots: #2B1511;
  --ink: #FBE8C4;
  --ink-soft: #CFB189;
  --paper: #3A2019;
  --paper-2: #4A2A20;
  --line: #0B0403;
  --shadow: #0B0403;
  --cran: #E05A60;
  --cran-ink: #1D0D0A;
  --avo: #B4CE78;
  --avo-wash: #2E3A1B;
  --pump: #F28A45;
  --crust: #B77A33;
  --cloth: #5E171B;
  --check: rgba(0, 0, 0, .3);
  --cloth-stitch: rgba(251, 232, 196, .32);
  --stitch: rgba(251, 232, 196, .25);
  --plate: #F2E7CE;
  --plate-rim: #D6C7A4;
  --side: #0F0605;
  --side-ink: #FBE8C4;
  --side-soft: #A98C68;
  --hi: #F2B632;
  --hi-ink: #2B1409;
  --title-fill: #F2B632;
  --title-stroke: #0B0403;
  --title-shadow: #A81E24;
  --field: #2A1612;
  --backdrop: rgba(0, 0, 0, .65);
  --focus: #FBE8C4;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--page);
  background-image: radial-gradient(var(--dots) 1.3px, transparent 1.5px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--font-b);
  font-size: 1rem;
  line-height: 1.45;
  padding-bottom: calc(var(--bar-h) + 28px);
  overflow-x: hidden;
}
/* keeps page content from showing under a phone's translucent status bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 80; background: var(--page); }
body.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }

.wrap { max-width: 1260px; margin: 0 auto; padding: clamp(14px, 3vw, 34px); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  font: 800 .95rem/1.1 var(--font-b);
  color: var(--ink); background: var(--paper);
  border: 2px solid var(--line); border-radius: 999px;
  padding: .62em 1.05em;
  box-shadow: 2px 3px 0 var(--shadow);
  cursor: pointer; white-space: nowrap;
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 4px 0 var(--shadow); }
.btn:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--shadow); }
.btn--small { font-size: .82rem; padding: .5em .85em; }
.btn--go { background: var(--cran); color: var(--cran-ink); }
.btn--quiet { background: transparent; border-color: transparent; box-shadow: none; text-decoration: underline; text-underline-offset: 3px; }
.btn--quiet:hover, .btn--quiet:active { box-shadow: none; transform: none; }
.btn--danger { color: var(--cran); }

/* ---------- hero ---------- */
.hero { position: relative; padding-bottom: clamp(10px, 2vw, 22px); }
.hero-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kicker { font-family: var(--font-d); font-size: clamp(1.05rem, 2.2vw, 1.4rem); line-height: 1.1; }
.hero-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mode { font-size: .8rem; font-weight: 600; background: var(--paper); color: var(--ink); border: 2px dashed var(--line); border-radius: 999px; padding: .32em .8em; }
.hero-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(16px, 3vw, 40px); align-items: end; margin-top: clamp(8px, 1.6vw, 18px); }
.title {
  font-family: var(--font-d); font-weight: 400;
  font-size: clamp(2.9rem, 9.4vw, 6.2rem); line-height: .92; letter-spacing: .005em;
  color: var(--title-fill);
  -webkit-text-stroke: clamp(5px, .085em, 10px) var(--title-stroke);
  paint-order: stroke fill;
  text-shadow: .05em .065em 0 var(--title-shadow);
  padding: .06em .08em .12em 0;
}
.when { font-size: clamp(1.05rem, 2vw, 1.3rem); font-weight: 600; margin-top: .5em; max-width: 34ch; }
.hero-side { display: grid; justify-items: end; gap: 10px; position: relative; }
.turkey {
  width: clamp(76px, 11vw, 124px); aspect-ratio: 1; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--line);
  box-shadow: 3px 4px 0 var(--shadow);
  display: grid; place-items: center; cursor: pointer; padding: 0;
  font-size: clamp(2.6rem, 6vw, 4.4rem); line-height: 1;
  transform: rotate(-8deg);
  position: relative;
  transition: transform .15s ease;
}
.turkey::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 2px dashed var(--stitch); pointer-events: none; }
.turkey:hover { transform: rotate(-2deg) scale(1.04); }
.turkey.is-gobbling { animation: gobble .7s ease; }
@keyframes gobble {
  0%, 100% { transform: rotate(-8deg) scale(1); }
  15% { transform: rotate(8deg) scale(1.15); }
  30% { transform: rotate(-12deg) scale(1.1); }
  45% { transform: rotate(10deg) scale(1.14); }
  60% { transform: rotate(-10deg) scale(1.08); }
  80% { transform: rotate(4deg) scale(1.03); }
}
.quip {
  position: absolute; right: calc(clamp(76px, 11vw, 124px) + 12px); top: 4px;
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--line); border-radius: 14px 14px 2px 14px;
  box-shadow: 2px 3px 0 var(--shadow);
  padding: .5em .8em; font-weight: 600; font-size: .92rem;
  width: max-content; max-width: min(250px, 58vw); z-index: 3;
  animation: pop .18s ease-out;
}
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.countdown { display: flex; gap: 8px; }
.tick {
  min-width: clamp(54px, 7vw, 78px); text-align: center;
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--line); border-radius: 12px;
  box-shadow: 2px 3px 0 var(--shadow);
  padding: 7px 6px 6px;
}
.tick b { display: block; font-family: var(--font-d); font-weight: 400; font-size: clamp(1.5rem, 3.4vw, 2.3rem); line-height: 1; font-variant-numeric: tabular-nums; }
.tick span { display: block; font-size: .72rem; font-weight: 600; color: var(--ink-soft); margin-top: 3px; }
.countdown-done { font-family: var(--font-d); font-size: clamp(1.4rem, 3vw, 2rem); background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; box-shadow: 2px 3px 0 var(--shadow); padding: .35em .7em; }

.leaves { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
.leaf { position: absolute; left: 0; will-change: transform; }

/* the headline slides without fading: a fade would show its outline through the letters */
body.intro .title { animation: slide .7s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes slide { from { transform: translateY(26px); } to { transform: none; } }
body.intro .when, body.intro .hero-side { animation: rise .7s .12s cubic-bezier(.2, .9, .3, 1.1) both; }
@keyframes rise { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- pie-o-meter ---------- */
.meter {
  display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.5fr); gap: clamp(12px, 2.4vw, 28px); align-items: center;
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--line); border-radius: 22px;
  box-shadow: 4px 5px 0 var(--shadow);
  padding: clamp(12px, 2vw, 20px) clamp(14px, 2.4vw, 26px);
  margin-top: clamp(8px, 1.6vw, 16px);
}
.pie { width: clamp(76px, 9vw, 108px); aspect-ratio: 1; flex: none; overflow: visible; filter: drop-shadow(3px 4px 0 var(--shadow)); }
.pie .crust { fill: var(--crust); stroke: var(--line); stroke-width: 2; }
.pie .slice { fill: var(--plate); stroke: var(--line); stroke-width: 1.4; stroke-linejoin: round; }
.pie .slice.is-in { fill: var(--pump); }
.pie .cream { fill: var(--plate); stroke: var(--line); stroke-width: 1; }
.meter-big { font-size: clamp(1rem, 1.7vw, 1.2rem); font-weight: 600; line-height: 1.15; }
.meter-big .num { display: block; font-family: var(--font-d); font-size: clamp(1.9rem, 4.2vw, 3rem); line-height: 1; }
.meter-small { font-size: .9rem; color: var(--ink-soft); margin-top: 6px; }
.meter-need-h { font-size: .9rem; font-weight: 800; }
.meter-need-l { font-size: .98rem; margin-top: 2px; }
.meter-need--done > p { font-family: var(--font-d); font-weight: 400; font-size: 1.2rem; }

/* ---------- chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: .42em;
  font: 600 .92rem/1.12 var(--font-b);
  color: var(--ink); background: var(--paper);
  border: 2px solid var(--line); border-radius: 999px;
  padding: .44em .85em .44em .58em;
  box-shadow: 2px 2px 0 var(--shadow);
  cursor: grab; white-space: nowrap; text-align: left;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation;
  transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease;
}
.chip .e { font-size: 1.3em; line-height: 1; }
.chip:hover { transform: translate(-1px, -2px); box-shadow: 3px 4px 0 var(--shadow); }
.chip.is-hand { background: var(--hi); color: var(--hi-ink); animation: wiggle .45s ease-in-out infinite alternate; }
@keyframes wiggle { from { transform: rotate(-2.5deg) translateY(-2px); } to { transform: rotate(2.5deg) translateY(-2px); } }
.chip.is-lifted { opacity: .35; border-style: dashed; box-shadow: none; }
.chip.is-local { border-style: dashed; }
.chip--claimed { background: var(--avo-wash); font-size: .8rem; white-space: normal; border-radius: 12px; padding: .42em .6em .42em .5em; box-shadow: 1px 2px 0 var(--shadow); }
.chip.is-lucky { background: var(--hi); color: var(--hi-ink); transform: scale(1.08); }

.ghost {
  position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; margin: 0;
  box-shadow: 6px 9px 0 rgba(0, 0, 0, .28);
  background: var(--hi); color: var(--hi-ink);
  animation: none; opacity: 1; border-style: solid;
  transition: none; will-change: transform;
}

/* ---------- stage: buffet + table ---------- */
.stage { display: grid; grid-template-columns: minmax(270px, 330px) minmax(0, 1fr); gap: clamp(16px, 2.2vw, 26px); align-items: start; margin-top: clamp(16px, 2.4vw, 26px); }

.buffet {
  --focus: var(--side-ink);
  position: sticky; top: calc(14px + env(safe-area-inset-top, 0px));
  max-height: calc(100vh - 28px); overflow: auto;
  scrollbar-width: thin; scrollbar-color: var(--side-soft) transparent;
  background: var(--side); color: var(--side-ink);
  border: 2px solid var(--line); border-radius: 22px;
  box-shadow: 4px 5px 0 var(--shadow);
  padding: 16px;
  z-index: 30;
}
.buffet.is-over { outline: 4px dashed var(--hi); outline-offset: -8px; }
.buffet-head { margin-bottom: 14px; }
.buffet-title h2 { font-family: var(--font-d); font-weight: 400; font-size: 1.5rem; line-height: 1.1; }
.hint { font-size: .86rem; color: var(--side-soft); margin-top: 4px; }
.buffet-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.only-narrow { display: none; }
.buffet-list { display: grid; gap: 12px; }
.group h3 { font: 800 .8rem/1.2 var(--font-b); color: var(--side-soft); margin-bottom: 6px; }
.group .chips { display: flex; flex-wrap: wrap; gap: 7px; }
.bare { font-size: .95rem; color: var(--side-soft); }

.hand {
  background: var(--hi); color: var(--hi-ink);
  border: 2px solid var(--line); border-radius: 16px;
  padding: 10px 12px;
  display: grid; gap: 6px;
}
.hand-what { font-family: var(--font-d); font-size: 1.15rem; line-height: 1.15; }
.hand-how { font-size: .88rem; font-weight: 600; }
.hand-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.hand .btn { color: #2B1409; background: #FFF6E1; }

.table {
  position: relative;
  background-color: var(--cloth);
  background-image:
    linear-gradient(90deg, var(--check) 50%, transparent 50%),
    linear-gradient(var(--check) 50%, transparent 50%);
  background-size: 44px 44px;
  border: 2px solid var(--line); border-radius: 26px;
  box-shadow: 5px 6px 0 var(--shadow);
  padding: clamp(14px, 2.2vw, 26px);
}
.table::after { content: ""; position: absolute; inset: 7px; border: 2px dashed var(--cloth-stitch); border-radius: 19px; pointer-events: none; }
.table-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; position: relative; z-index: 1; }
.table-head h2 {
  font-family: var(--font-d); font-weight: 400; font-size: 1.4rem; line-height: 1.1;
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--line); border-radius: 999px;
  box-shadow: 2px 3px 0 var(--shadow);
  padding: .22em .75em .26em; transform: rotate(-1.5deg);
}
.table-tip { flex: 1 1 100%; font-size: .82rem; font-weight: 600; line-height: 1.3; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: .45em .8em; max-width: 60ch; }
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); grid-auto-flow: dense; gap: 16px; align-items: start; position: relative; z-index: 1; }

.seat {
  position: relative;
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--line); border-radius: 18px;
  box-shadow: 3px 4px 0 var(--shadow);
  padding: 14px 10px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
  transition: transform .15s ease, box-shadow .15s ease;
}
.seat::before { content: ""; position: absolute; inset: 5px; border: 1.5px dashed var(--stitch); border-radius: 12px; pointer-events: none; }
.seat:nth-child(3n+1) { transform: rotate(-.7deg); }
.seat:nth-child(3n+2) { transform: rotate(.6deg); }
.seat.is-local { border-style: dashed; }
.seat.is-lifted-seat { opacity: .45; }
/* two or more people sharing a plate get a double-width placemat */
.seat--duo { grid-column: span 2; flex-direction: row; align-items: center; gap: 14px; text-align: left; padding: 14px 16px 14px 12px; }
.seat--duo .seat-main { flex: 0 0 42%; width: auto; }
.seat--duo .seat-body { flex: 1 1 0; min-width: 0; align-items: flex-start; }
.seat--duo .haul { justify-content: flex-start; }
.seat-body { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; position: relative; z-index: 1; }
.seat-main {
  background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;
  border-radius: 12px; position: relative; z-index: 1;
}
.plate {
  position: relative; display: block;
  width: clamp(88px, 62%, 116px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, var(--plate) 0 56%, var(--plate-rim) 57% 60%, var(--plate) 61% 100%);
  border: 2px solid var(--line);
  box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
  font-size: 1rem;
  transition: transform .15s ease;
}
.bite { position: absolute; transform: translate(-50%, -50%); line-height: 1; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .14)); }
.bite--none { left: 50%; top: 50%; font-size: 1.9em; opacity: .28; filter: grayscale(1); }
.more { position: absolute; right: -6px; bottom: -4px; background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; font-size: .72rem; font-weight: 800; padding: .1em .45em; }
.namecard { font-family: var(--font-d); font-size: 1.12rem; line-height: 1.1; overflow-wrap: anywhere; }
.quote { font-size: .8rem; font-style: italic; color: var(--ink-soft); line-height: 1.3; position: relative; z-index: 1; }
.haul { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; position: relative; z-index: 1; }
.none { font-size: .8rem; color: var(--ink-soft); position: relative; z-index: 1; }

.seat.is-over { transform: translateY(-5px) rotate(-1.2deg) scale(1.04); box-shadow: 6px 9px 0 var(--shadow); z-index: 2; }
.seat.is-over .plate { transform: scale(1.1); box-shadow: 0 0 0 5px var(--hi), 0 3px 0 rgba(0, 0, 0, .12); }
body.has-hand .seat { cursor: pointer; outline: 3px dashed var(--hi); outline-offset: 2px; }
body.has-hand .seat:hover { transform: translateY(-3px) scale(1.02); }
.seat.just-fed .plate { animation: fed .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes fed { 0% { transform: scale(.82); } 55% { transform: scale(1.16) rotate(4deg); } 100% { transform: scale(1); } }

/* ---------- footer ---------- */
.foot { margin-top: clamp(18px, 3vw, 34px); display: grid; gap: 10px; justify-items: start; }
.foot-note, .foot-how { font-size: .9rem; max-width: 62ch; }
.foot-note { color: var(--ink-soft); }

/* ---------- save bar ---------- */
.bar {
  position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  z-index: 40; width: min(640px, calc(100% - 24px));
  background: var(--paper); color: var(--ink);
  border: 2px solid var(--line); border-radius: 18px;
  box-shadow: 4px 5px 0 var(--shadow);
  padding: 10px 12px 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap;
}
.bar-msg { font-size: .92rem; flex: 1 1 220px; min-width: 0; }
.bar-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.spin { display: inline-block; width: 1em; height: 1em; border: 3px solid var(--stitch); border-top-color: var(--cran); border-radius: 50%; vertical-align: -.15em; margin-right: .4em; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- toasts ---------- */

  function resolveMode() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { setMode('guest'); return; }
    Promise.all([safeUse('artifact'), safeUse('user')]).then(function (r) {
      var art = r[0], usr = r[1];
      if (!art || typeof art.publish !== 'function') { setMode('guest'); return; }
      artifactNs = art;
      if (!usr || typeof usr.canEdit !== 'function') { setMode('writer'); return; }
      var p;
      try { p = Promise.resolve(usr.canEdit()); } catch (e) { p = Promise.resolve(null); }
      p.then(function (ok) { setMode(ok === false ? 'guest' : 'writer'); }, function () { setMode('writer'); });
    });
  }

  /* =====================================================================
     Drag and drop. Mouse and pen use pointer events. Touch uses touch
     events so a long press can lift a dish without fighting the scroll.
     ===================================================================== */
  var drag = { active: false, pending: null, kind: '', what: 'dish', id: null, ghost: null, over: null, overBuffet: false, x: 0, y: 0, w: 0, h: 0, off: 0, home: null, raf: 0, touchId: null };

  function chipFrom(target) { return target && target.closest ? target.closest('.chip[data-dish]') : null; }
  /* A name can be dragged onto another name to seat them together, but not while a dish is in hand. */
  function seatMainFrom(target) { return !hand && target && target.closest ? target.closest('.seat-main') : null; }
  function pendingFrom(target) {
    var chip = chipFrom(target), sm;
    if (chip) return { what: 'dish', el: chip, id: chip.getAttribute('data-dish') };
    sm = seatMainFrom(target);
    if (sm && sm.closest('.seat')) return { what: 'seat', el: sm, id: sm.closest('.seat').getAttribute('data-guest') };
    return null;
  }
  function cancelPending() { if (drag.pending) { if (drag.pending.timer) clearTimeout(drag.pending.timer); drag.pending = null; } }

  function place() {
    if (!drag.ghost) return;
    drag.ghost.style.transform = 'translate(' + (drag.x - drag.w / 2) + 'px,' + (drag.y + drag.off - drag.h / 2) + 'px) rotate(-5deg) scale(1.08)';
  }
  function hit() {
    var el = document.elementFromPoint(drag.x, drag.y + drag.off);
    var seat = el && el.closest ? el.closest('.seat') : null;
    var buf = el && el.closest ? el.closest('#buffet') : null;
    if (drag.what === 'seat') {
      buf = null;
      if (seat && seat.getAttribute('data-guest') === drag.id) seat = null;
    }
    if (drag.over && drag.over !== seat) drag.over.classList.remove('is-over');
    if (seat && drag.over !== seat) seat.classList.add('is-over');
    drag.over = seat || null;
    var d = findD(work, drag.id), canReturn = !!(buf && d && d.by);
    if (canReturn !== drag.overBuffet) { $('#buffet').classList.toggle('is-over', canReturn); drag.overBuffet = canReturn; }
  }
  function scrollLoop() {
    if (!drag.active) return;
    var y = drag.y, vh = window.innerHeight, tray = mqNarrow.matches ? $('#buffet').offsetHeight : 0, edge = vh - tray, dy = 0;
    /* An edge only scrolls once the finger has been away from it, so lifting a dish near an edge does not jolt the page. */
    if (y > 104) drag.armTop = true;
    if (y < edge - 92) drag.armBottom = true;
    if (y < 84 && drag.armTop) dy = -Math.ceil((84 - y) / 6) - 2;
    else if (y < edge && y > edge - 72 && drag.armBottom) dy = Math.ceil((y - (edge - 72)) / 6) + 2;
    if (dy) { window.scrollBy(0, dy); hit(); }
    drag.raf = requestAnimationFrame(scrollLoop);
  }
  function startDrag(id, el, x, y, kind, touchId, what) {
    if (!el || !el.isConnected) return;
    var r, g;
    if (what === 'seat') {
      var guest = findG(work, id), seat = el.closest('.seat'), card = $('.namecard', el);
      if (!guest || !seat) return;
      g = document.createElement('div');
      g.className = 'chip ghost'; g.setAttribute('aria-hidden', 'true');
      g.innerHTML = '<span class="e">🪑</span><span class="t">' + esc(guest.name) + '</span>';
      document.body.appendChild(g);
      r = g.getBoundingClientRect();
      drag.home = (card || el).getBoundingClientRect();
      seat.classList.add('is-lifted-seat');
    } else {
      if (!findD(work, id)) return;
      if (hand) setHand(null, true);
      r = el.getBoundingClientRect();
      g = el.cloneNode(true);
      g.className = 'chip ghost';
      g.removeAttribute('data-dish'); g.removeAttribute('aria-pressed'); g.setAttribute('aria-hidden', 'true');
      g.style.width = Math.ceil(r.width) + 'px';
      document.body.appendChild(g);
      drag.home = r;
      $$('.chip[data-dish]').forEach(function (c) { if (c.getAttribute('data-dish') === id) c.classList.add('is-lifted'); });
    }
    drag.active = true; drag.kind = kind; drag.what = what === 'seat' ? 'seat' : 'dish'; drag.id = id; drag.ghost = g;
    drag.touchId = touchId == null ? null : touchId;
    drag.w = r.width; drag.h = r.height; drag.x = x; drag.y = y;
    drag.off = kind === 'touch' ? -(r.height / 2 + 26) : 0;
    drag.armTop = false; drag.armBottom = false;
    document.body.classList.add('dragging');
    place(); hit(); sfx.pick();
    drag.raf = requestAnimationFrame(scrollLoop);
  }
  function moveDrag(x, y) { drag.x = x; drag.y = y; place(); hit(); }
  function endDragState() {
    drag.active = false;
    cancelAnimationFrame(drag.raf);
    if (drag.over) drag.over.classList.remove('is-over');
    drag.over = null; drag.overBuffet = false;
    $('#buffet').classList.remove('is-over');
    document.body.classList.remove('dragging');
    $$('.chip.is-lifted').forEach(function (c) { c.classList.remove('is-lifted'); });
    $$('.seat.is-lifted-seat').forEach(function (c) { c.classList.remove('is-lifted-seat'); });
    var g = drag.ghost; drag.ghost = null;
    return g;
  }
  function flyHome(ghost, home) {
    if (!ghost) return;
    if (reduceMotion || !ghost.animate || !home) { ghost.remove(); return; }
    var a = ghost.animate(
      [{ transform: ghost.style.transform, opacity: 1 }, { transform: 'translate(' + home.left + 'px,' + home.top + 'px) rotate(0deg) scale(1)', opacity: 0.3 }],
      { duration: 220, easing: 'ease-in' });
    a.onfinish = function () { ghost.remove(); };
  }
  function finishDrag() {
    var seat = drag.over, back = drag.overBuffet, id = drag.id, home = drag.home, what = drag.what;
    var gid = seat ? seat.getAttribute('data-guest') : null;
    var ghost = endDragState();
    if (what === 'seat') {
      /* the name that was dragged joins the seat it was dropped on */
      if (gid && gid !== id) { if (ghost) ghost.remove(); mergeSeats(gid, id); }
      else flyHome(ghost, home);
      return;
    }
    if (gid) { if (ghost) ghost.remove(); give(id, gid); }
    else if (back) { if (ghost) ghost.remove(); putBack(id); }
    else flyHome(ghost, home);
  }
  function cancelDrag() { if (!drag.active) return; var home = drag.home; flyHome(endDragState(), home); }

  function bindDrag() {
    /* mouse and pen */
    document.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch' || e.button !== 0 || drag.active) return;
      var p = pendingFrom(e.target); if (!p) return;
      p.mouse = true; p.x = e.clientX; p.y = e.clientY;
      drag.pending = p;
    });
    document.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      if (drag.active && drag.kind === 'mouse') {
        if (e.buttons === 0) { finishDrag(); return; }
        moveDrag(e.clientX, e.clientY); return;
      }
      var p = drag.pending;
      if (p && p.mouse) {
        if (e.buttons === 0) { drag.pending = null; return; }
        var dx = e.clientX - p.x, dy = e.clientY - p.y;
        if (dx * dx + dy * dy > 36) { drag.pending = null; startDrag(p.id, p.el, e.clientX, e.clientY, 'mouse', null, p.what); }
      }
    });
    document.addEventListener('pointerup', function (e) {
      if (e.pointerType === 'touch') return;
      if (drag.active && drag.kind === 'mouse') { suppressClickUntil = Date.now() + 60; drag.x = e.clientX; drag.y = e.clientY; hit(); finishDrag(); }
      if (drag.pending && drag.pending.mouse) drag.pending = null;
    });
    document.addEventListener('pointercancel', function (e) {
      if (e.pointerType === 'touch') return;
      cancelDrag(); if (drag.pending && drag.pending.mouse) drag.pending = null;
    });

    /* touch: hold, then drag */
    function touchById(list, id) { for (var i = 0; i < list.length; i++) if (list[i].identifier === id) return list[i]; return null; }
    document.addEventListener('touchstart', function (e) {
      if (drag.active) return;
      cancelPending();
      if (e.touches.length !== 1) return;
      var p = pendingFrom(e.target); if (!p) return;
      var t = e.touches[0];
      p.touch = true; p.x = t.clientX; p.y = t.clientY; p.touchId = t.identifier; p.timer = 0;
      p.timer = setTimeout(function () {
        if (drag.pending !== p) return;
        drag.pending = null;
        startDrag(p.id, p.el, p.x, p.y, 'touch', p.touchId, p.what);
        try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) { /* ignore */ }
      }, 240);
      drag.pending = p;
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (drag.active && drag.kind === 'touch') {
        if (e.cancelable) e.preventDefault();
        var t = touchById(e.touches, drag.touchId);
        if (t) moveDrag(t.clientX, t.clientY);
        return;
      }
      var p = drag.pending;
      if (p && p.touch) {
        var m = touchById(e.touches, p.touchId);
        if (!m) { cancelPending(); return; }
        var dx = m.clientX - p.x, dy = m.clientY - p.y;
        if (dx * dx + dy * dy > 100) cancelPending();
      }
    }, { passive: false });
    document.addEventListener('touchend', function (e) {
      if (drag.active && drag.kind === 'touch') {
        var t = touchById(e.changedTouches, drag.touchId);
        if (!t && touchById(e.touches, drag.touchId)) return;
        if (e.cancelable) e.preventDefault();
        suppressClickUntil = Date.now() + 350;
        if (t) { drag.x = t.clientX; drag.y = t.clientY; hit(); }
        finishDrag();
        return;
      }
      cancelPending();
    }, { passive: false });
    document.addEventListener('touchcancel', function () {
      if (drag.active && drag.kind === 'touch') cancelDrag();
      cancelPending();
    });

    document.addEventListener('contextmenu', function (e) { if (chipFrom(e.target) || (e.target.closest && e.target.closest('.seat-main'))) e.preventDefault(); });
    document.addEventListener('dragstart', function (e) { e.preventDefault(); });
    window.addEventListener('blur', function () { cancelDrag(); cancelPending(); });
  }

  /* =====================================================================
     Clicks and keys
     ===================================================================== */
  function act(name, el) {
    var id, g, d;
    switch (name) {
      case 'bell':
        soundOn = !soundOn; prefs.sound = soundOn; lsSet(prefs); renderBell();
        if (soundOn) sfx.drop();
        break;
      case 'gobble': gobble(); break;
      case 'roll': openRoll(); break;
      case 'roll-again': spin(); break;
      case 'roll-take':
        id = reel.pick; closeDlg();
        if (id && findD(work, id) && !findD(work, id).by) setHand(id);
        break;
      case 'add-dish': openAddDish(); break;
      case 'dish-ok': submitDish(); break;
      case 'add-guest': openAddGuest(); break;
      case 'guest-ok': submitGuest(); break;
      case 'emoji':
        $$('.emoji-btn', dlg).forEach(function (b) { b.setAttribute('aria-checked', b === el ? 'true' : 'false'); });
        break;
      case 'toggle-buffet': buffetOpen = !buffetOpen; renderBuffetHead(); syncSpace(); break;
      case 'seat': openSeat(el.closest('.seat').getAttribute('data-guest')); break;
      case 'seat-back': id = el.getAttribute('data-d'); closeDlg(); putBack(id); break;
      case 'seat-ok':
        g = findG(work, el.getAttribute('data-g'));
        if (!g) { closeDlg(); break; }
        if (applySeatForm(g)) { closeDlg(); changed({}); }
        break;
      case 'seat-split':
        g = findG(work, el.getAttribute('data-g'));
        if (!g) { closeDlg(); break; }
        if (applySeatForm(g)) { closeDlg(); splitSeat(g.id, +el.getAttribute('data-i')); }
        break;
      case 'seat-join':
        g = findG(work, el.getAttribute('data-g')); id = ($('#f-join', dlg) || {}).value;
        if (!g) { closeDlg(); break; }
        if (!id) { showErr('Choose who to seat them with.'); break; }
        if (applySeatForm(g)) { closeDlg(); mergeSeats(g.id, id); }
        break;
      case 'seat-remove':
        if (el.getAttribute('data-sure') !== '1') { el.setAttribute('data-sure', '1'); el.textContent = 'Really remove?'; break; }
        id = el.getAttribute('data-g'); g = findG(work, id);
        if (g) {
          work.guests = work.guests.filter(function (x) { return x.id !== id; });
          work.dishes.forEach(function (x) { if (x.by === id) x.by = null; });
          closeDlg(); changed({ back: true });
          toast(g.name + ' has left the table.');
        } else closeDlg();
        break;
      case 'put-back': if (hand) putBack(hand); break;
      case 'del-dish':
        d = hand ? findD(work, hand) : null;
        if (d && d.custom && !d.by) {
          work.dishes = work.dishes.filter(function (x) { return x.id !== d.id; });
          changed({ back: true });
          toast(d.emoji + ' ' + d.name + ' is off the list.');
        }
        break;
      case 'cancel-hand': setHand(null); break;
      case 'save': save(); break;
      case 'discard': discard(); break;
      case 'copy-picks': copyText(picksText(), 'Copied. Paste it in the group chat.'); break;
      case 'copy-menu': copyText(menuText(), 'Menu copied.'); break;
      case 'select-all': d = $('#copybox', dlg); if (d) { d.focus(); d.select(); } break;
      case 'dlg-close': closeDlg(); break;
    }
  }

  function bindUi() {
    document.addEventListener('click', function (e) {
      if (Date.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
    }, true);
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      if (t === dlg) { closeDlg(); return; }
      var seat = t.closest('.seat'), chip = chipFrom(t);
      if (hand && seat) {
        if (chip && chip.getAttribute('data-dish') === hand) { setHand(null); return; }
        give(hand, seat.getAttribute('data-guest'), true);
        return;
      }
      if (chip) { var id = chip.getAttribute('data-dish'); setHand(hand === id ? null : id); return; }
      var a = t.closest('[data-act]');
      if (a && !a.disabled) act(a.getAttribute('data-act'), a);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (drag.active) { cancelDrag(); return; }
        if (hand && !dlgOpen()) setHand(null);
        return;
      }
      if (e.key === 'Enter' && dlgOpen() && e.target && e.target.tagName === 'INPUT') {
        var go = $('.btn--go', dlg);
        if (go) { e.preventDefault(); go.click(); }
      }
    });
    dlg.addEventListener('close', function () { stopReel(); dlg.innerHTML = ''; });
    window.addEventListener('resize', syncSpace);
    if (mqNarrow.addEventListener) mqNarrow.addEventListener('change', syncSpace);
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(syncSpace);
      ro.observe($('#buffet')); ro.observe($('#bar'));
    }
  }

  /* =====================================================================
     Start
     ===================================================================== */
  /* A copy of this page hosted as plain files, with no Claude around it, reads the board from
     board.json next to it. That lets the board be refreshed without replacing the page. */
  var standalone = !window.claude && /^https?:$/.test(location.protocol);
  function fetchBoard() {
    return fetch('board.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (raw) { return raw && Array.isArray(raw.guests) && Array.isArray(raw.dishes) ? normalize(raw) : null; })
      .catch(function () { return null; });
  }
  function refreshBoard() {
    if (drag.active || drag.pending || hand || dlgOpen()) return;
    fetchBoard().then(function (next) {
      if (!next || JSON.stringify(next) === JSON.stringify(BASE)) return;
      if (drag.active || hand || dlgOpen()) return;
      var lost = rebase(next, ops);
      stashNow();
      var k = $('.kicker'), w = $('.when');
      if (k) k.textContent = BASE.event.kicker;
      if (w) w.textContent = BASE.event.line;
      renderAll();
      lost.forEach(function (n) { toast(n, 5600); });
      toast('The board was just updated.');
    });
  }

  var begun = false;
  function begin() {
    if (begun) return;
    begun = true;
    root.innerHTML = shellHtml();
    dlg = $('#dlg');
    renderAll(); renderMode(); renderBell(); renderCountdown();
    setInterval(renderCountdown, 1000);
    bindDrag(); bindUi();
    resolveMode();

    var now = Date.now();
    function recent(t) { return typeof t === 'number' && now - t < 20000; }
    if (typeof stash.y === 'number' && (recent(stash.saved) || recent(stash.conflict))) {
      try { window.scrollTo(0, stash.y); } catch (e) { /* ignore */ }
    }
    if (recent(stash.saved) && !ops.length) { toast('Saved for everyone.'); setTimeout(function () { rain(16); }, 150); }
    else if (recent(stash.conflict) && ops.length) { afterConflict = true; renderBar(); toast('Someone else saved at the same moment. Your changes are still here.', 5200); }
    notices.forEach(function (n) { toast(n, 5600); });
    if (!stash.seen) { document.body.classList.add('intro'); setTimeout(gust, 250); }
    stashNow();
  }

  if (standalone) {
    /* show the built-in board if board.json is slow or missing; a late answer is picked up by the refresh */
    setTimeout(begin, 2500);
    fetchBoard().then(function (next) {
      if (next && !begun) notices = rebase(next, stash.ops);
      begin();
    });
    setInterval(refreshBoard, 5000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && begun) refreshBoard(); });
  } else {
    begin();
  }
})();
</script>
</body>
</html>
